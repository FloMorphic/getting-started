# FloMorphic — the canvas, its API and the builtin plugin nodes, in one service.
#
# One container on purpose: the canvas is static assets, the API is a single Go
# binary, and the plugin nodes cannot start until the API has minted their NATS
# credential (POST /extension/plugin/cred). Splitting them would buy nothing but
# a bootstrap dance across three containers. nginx inside serves the SPA and
# proxies /api + /ws to the API on the loopback, so the browser only ever needs
# ONE port and there is no CORS and no baked-in backend host name.
#
# The image is fully baked — api, canvas AND the per-arch plugin binaries are all
# compiled in — so it needs no toolchain, no source volume and no network to
# build anything at start.
#
# Requires the Inflowenger platform (Infra + a Fractal) to be up FIRST — this
# stack joins the same external `inflow_net` network to reach Infra by name.
# Get it from https://github.com/Inflowenger/getting-started, or let this repo's
# install.sh do both.
#
#   cp .env.example .env      # set INFLOW_INFRA_JWT_SECRET = the platform's
#                             # API_JWT_SECRET (Infra's API Secret Key)
#   docker compose up -d
#   open http://localhost:8088
#
name: flomorphic

services:
  flomorphic:
    image: ${FLOMORPHIC_IMAGE:-mehdishokohi/flomorphic:latest}
    container_name: flomorphic
    # Always come back after a crash or a host reboot. There is no cross-stack
    # `depends_on` to make this wait for Infra (Infra lives in a separate compose
    # project, reachable only over the shared inflow_net network), so boot-order
    # resilience is handled at runtime instead: the API retries its Infra
    # connection with backoff, and the entrypoint starts the builtin nodes from a
    # cached credential until Infra answers. This policy is what re-launches the
    # container on reboot so those mechanisms get their chance.
    restart: unless-stopped
    # Real PID 1 for a container that supervises several processes (nginx, the
    # API and the plugin nodes): tini reaps zombies and forwards signals, so a
    # `docker stop` reaches every child rather than only the entrypoint shell.
    init: true
    # Room for the entrypoint's teardown: on TERM it signals its children, waits,
    # then KILLs stragglers — a little over the 10s default keeps stops clean.
    stop_grace_period: 20s
    environment:
      # ── runtime wiring ────────────────────────────────────────────────────
      # Infra's REST API — where the plugin credential is minted and runs are
      # dispatched from. Empty ⇒ the API serves CRUD only: you can design and
      # save workflows, but Run does nothing and no plugin node is credentialed.
      INFLOW_INFRA_API: ${INFLOW_INFRA_API:-http://inflow-infra:8022}
      # Infra's NATS endpoint, as host:port (no scheme — the plugin SDK prefixes
      # nats:// itself). This is Infra's OTHER address: the REST API answers on
      # 8022, NATS on 4222, and every plugin node talks over the latter. Left
      # empty it is derived from the INFLOW_INFRA_API host on port 4222, which is
      # right whenever the platform stack publishes both together. Set it when
      # they differ — a NATS port remapped on the host, or a separate address.
      PLUGIN_INFRA_URL: ${PLUGIN_INFRA_URL:-}
      # Infra's API Secret Key — the same value as the platform's API_JWT_SECRET.
      # Not enforced here: with it empty (or INFLOW_INFRA_API empty) the stack
      # still comes up CRUD-only, which is a legitimate standalone mode. The
      # container says so in its logs rather than refusing to start.
      INFLOW_INFRA_JWT_SECRET: ${INFLOW_INFRA_JWT_SECRET:-}
      # Guard this API's own CRUD routes with an HS256 bearer. Off by default,
      # matching the API's standalone behaviour.
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      API_JWT_SECRET: ${API_JWT_SECRET:-}
      DB_SOURCE: ${DB_SOURCE:-/data/flomorphic.db}

      # ── builtin plugin nodes (llm, mcp, …) ────────────────────────────────
      # Baked into the image per-arch and started by the container's entrypoint
      # once the API is up, all sharing a single credential minted on the
      # builtin-plugins account. Each node's PLUGIN_ID comes from morph-api's seed,
      # so saved workflows keep resolving across reinstalls.
      PLUGINS_ENABLED: ${PLUGINS_ENABLED:-1}
      # Comma-separated allow-list of baked nodes to run; empty = every one found.
      PLUGINS: ${PLUGINS:-}
    volumes:
      # SQLite database (workflows, contexts, prompts, human tasks, vectors).
      # Without this, every restart starts from an empty canvas.
      - ./data:/data
    ports:
      # The canvas — and everything the browser needs, via nginx.
      - "${FLOMORPHIC_PORT:-8088}:80"
      # The API, published directly for curl/scripts/other tools. Not needed by
      # the canvas. Defaults to 8026 so it never collides with inflow-inspector-api
      # on 8025.
      - "${FLOMORPHIC_API_PORT:-8026}:8025"
    networks:
      - inflow_net
    # Make the Docker host reachable by name from inside the container. On Linux
    # `host.docker.internal` does not exist unless it is injected like this
    # (it resolves to the bridge gateway). Needed whenever Infra — or an LLM, an
    # MCP server, a database a node calls — runs on the host rather than as a
    # container on inflow_net. Prefer the name over the gateway IP: the IP
    # changes whenever the network is recreated, and it is what a node URL or
    # these two variables should say:
    #   INFLOW_INFRA_API=http://host.docker.internal:8022
    #   PLUGIN_INFRA_URL=host.docker.internal:4222
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      # Everything is baked (api, canvas and plugin binaries), so startup is just
      # process launch — no clone or compile on the boot path.
      start_period: 60s
      start_interval: 5s
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # Shared, externally-managed network (fixed name, no compose project prefix)
  # so this stack lands on the exact same network as Infra and the Fractals:
  #   docker network create inflow_net
  inflow_net:
    external: true
